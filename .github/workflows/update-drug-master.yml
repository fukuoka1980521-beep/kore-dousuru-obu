name: Update drug master

on:
  workflow_dispatch:
  schedule:
    # Monday 05:15 JST
    - cron: "15 20 * * 0"
  push:
    branches:
      - master
    paths:
      - "scripts/update_drug_master.py"
      - ".github/workflows/update-drug-master.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current drug index
        run: python scripts/update_drug_master.py

      - name: Commit only when data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tekiou-byoumei/drug-master.json
          if git diff --cached --quiet; then
            echo "No drug-master change."
          else
            git commit -m "Update SSK drug master index"
            git push
          fi
